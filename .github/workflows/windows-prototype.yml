name: Windows prototype

on:
  workflow_dispatch:
  push:
    branches:
      - prototype/media-validation
      - experiment/web-speech-recognition
      - experiment/kroko-native
    paths:
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - "winres/**"
      - "tests/**"
      - "scripts/**"
      - "models/**"
      - "portable/**"
      - ".github/workflows/windows-prototype.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test projection controls
        run: node --test tests/projection-crop.test.mjs tests/projection-window.test.mjs tests/speech-test.test.mjs tests/voice-format.test.mjs tests/kroko-speech.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Resolve Go dependencies
        shell: pwsh
        run: go mod tidy
      - name: Install Wails CLI and generate named bindings
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          & "$(go env GOPATH)\\bin\\wails3.exe" generate bindings -names
      - name: Stage native Sherpa runtime for tests
        shell: pwsh
        run: |
          $modulePath = go list -m -f '{{.Dir}}' github.com/k2-fsa/sherpa-onnx-go-windows
          $dllDir = Join-Path $modulePath 'lib/x86_64-pc-windows-gnu'
          Copy-Item (Join-Path $dllDir '*.dll') .
          if (!(Test-Path 'sherpa-onnx-c-api.dll')) { throw 'Sherpa DLLs missing' }
      - name: Download and unpack Italian Kroko community model
        shell: pwsh
        run: |
          python scripts/prepare-kroko.py
      - name: Run Go tests
        shell: pwsh
        run: go test ./...
      - name: Generate Windows icon resources
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          & "$(go env GOPATH)\bin\go-winres.exe" make --arch amd64
          if (!(Test-Path "rsrc_windows_amd64.syso")) { throw "Windows icon resource not generated" }
      - name: Build Windows desktop executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -tags production -trimpath -ldflags="-s -w -H=windowsgui -X main.buildNumber=${{ github.run_number }}" -o dist/SA.DIT.exe .
      - name: Assemble portable package
        shell: pwsh
        run: |
          Copy-Item *.dll dist/
          New-Item -ItemType Directory -Force dist/models/kroko-it | Out-Null
          Copy-Item models/kroko-it/* dist/models/kroko-it/
          New-Item -ItemType Directory -Force dist/licenses | Out-Null
          Copy-Item licenses/KROKO-ATTRIBUTION.txt dist/licenses/
          Copy-Item portable/README.txt dist/README.txt
          Copy-Item portable/CHANGES.txt dist/CHANGES.txt
          if (!(Test-Path dist/models/kroko-it/encoder.onnx)) { throw 'Kroko model missing' }
          if (!(Test-Path dist/README.txt)) { throw 'Portable README missing' }
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: SA.DIT-Kroko-Windows-amd64-prototype
          path: dist/
          if-no-files-found: error
          retention-days: 14
